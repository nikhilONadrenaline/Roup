server:
  port: ${PORT:0}

spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/roup_users}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://${EUREKA_SERVER_HOSTPORT:localhost:8761}/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    non-secure-port: ${PORT:0}
    instance-id: ${spring.application.name}:${random.uuid}

# Feign Client configuration for synchronous internal calls
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: BASIC
