server:
  port: ${PORT:0}

spring:
  application:
    name: orders-service
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://${EUREKA_SERVER_HOSTPORT:localhost:8761}/eureka/}
  instance:
    prefer-ip-address: false
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    non-secure-port: ${PORT:0}
    instance-id: ${spring.application.name}:${random.uuid}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
